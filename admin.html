<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKTHRONE TATTOOS | Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1, h2 {
    color: #c5a253;
    text-align: center;
}

.subtitle {
    color: #bbb;
    text-align: center;
    margin-bottom: 35px;
}

.panel {
    background: #151515;
    border: 1px solid #c5a253;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    background: #080808;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
}

button {
    padding: 11px 18px;
    margin: 5px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #c5a253;
    color: #080808;
}

.approve {
    background: #198754;
    color: white;
}

.reject {
    background: #dc3545;
    color: white;
}

.edit {
    background: #2878bd;
    color: white;
}

.delete {
    background: #555;
    color: white;
}

.review-card {
    background: #080808;
    border: 1px solid #444;
    border-radius: 7px;
    padding: 20px;
    margin: 18px 0;
}

.review-card h3 {
    color: #c5a253;
}

.stars {
    color: #c5a253;
    font-size: 20px;
}

.status {
    color: #c5a253;
    font-weight: bold;
}

#dashboard {
    display: none;
}

#message {
    text-align: center;
    color: #c5a253;
    margin: 15px 0;
}

.actions {
    margin-top: 15px;
}

@media(max-width: 600px) {
    button {
        width: 100%;
        margin: 5px 0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>INKTHRONE TATTOOS</h1>
<p class="subtitle">CUSTOMER REVIEWS ADMIN DASHBOARD</p>

<div id="loginPanel" class="panel">

    <h2>ADMIN LOGIN</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            value="academicproservices80@gmail.com"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Admin password"
            required
        >

        <button type="submit" class="primary">
            LOGIN
        </button>

    </form>

</div>

<div id="dashboard">

    <div class="panel">
        <h2>MANAGE CUSTOMER REVIEWS</h2>

        <select id="filter">
            <option value="pending">Pending Reviews</option>
            <option value="approved">Approved Reviews</option>
            <option value="rejected">Rejected Reviews</option>
            <option value="all">All Reviews</option>
        </select>

        <button class="primary" onclick="loadReviews()">
            REFRESH REVIEWS
        </button>

        <button class="delete" onclick="logout()">
            LOG OUT
        </button>
    </div>

    <div id="reviewsList"></div>

</div>

<p id="message"></p>

</div>

<script>

const SUPABASE_URL =
"https://pnherqvwcijxxpmvkult.supabase.co";

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const tattooAdmin = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener(
"submit", async function(event) {

    event.preventDefault();

    message.textContent = "Signing in...";

    const { error } = await tattooAdmin.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
    });

    if (error) {
        message.textContent = "Login failed: " + error.message;
        return;
    }

    loginPanel.style.display = "none";
    dashboard.style.display = "block";

    message.textContent = "Welcome to your dashboard.";

    loadReviews();

});

async function checkSession() {

    const { data } = await tattooAdmin.auth.getSession();

    if (data.session) {

        loginPanel.style.display = "none";
        dashboard.style.display = "block";

        loadReviews();

    }

}

async function loadReviews() {

    const list = document.getElementById("reviewsList");

    list.textContent = "Loading reviews...";

    const filter = document.getElementById("filter").value;

    let query = tattooAdmin
        .from("tattoo_reviews")
        .select("*")
        .order("created_at", { ascending: false });

    if (filter !== "all") {
        query = query.eq("status", filter);
    }

    const { data, error } = await query;

    if (error) {
        list.textContent = "Unable to load reviews: " + error.message;
        return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {
        list.textContent = "No reviews found in this category.";
        return;
    }

    data.forEach(review => {

        const card = document.createElement("div");
        card.className = "review-card";

        const title = document.createElement("h3");
        title.textContent = review.customer_name;

        const service = document.createElement("p");
        service.textContent = "Service: " + review.service;

        const stars = document.createElement("div");
        stars.className = "stars";
        stars.textContent =
            "★".repeat(review.rating) +
            "☆".repeat(5 - review.rating);

        const feedback = document.createElement("p");
        feedback.textContent = review.review;

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "Status: " + review.status.toUpperCase();

        const actions = document.createElement("div");
        actions.className = "actions";

        if (review.status !== "approved") {
            actions.appendChild(
                createButton("APPROVE", "approve", () =>
                    updateReview(review.id, {status: "approved"})
                )
            );
        }

        if (review.status !== "rejected") {
            actions.appendChild(
                createButton("REJECT", "reject", () =>
                    updateReview(review.id, {status: "rejected"})
                )
            );
        }

        actions.appendChild(
            createButton("EDIT", "edit", () => editReview(review))
        );

        actions.appendChild(
            createButton("DELETE", "delete", () => deleteReview(review.id))
        );

        card.append(title, service, stars, feedback, status, actions);

        list.appendChild(card);

    });

}

function createButton(label, className, action) {

    const button = document.createElement("button");

    button.textContent = label;
    button.className = className;
    button.onclick = action;

    return button;

}

async function updateReview(id, changes) {

    const { error } = await tattooAdmin
        .from("tattoo_reviews")
        .update(changes)
        .eq("id", id);

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = "Review updated successfully.";

    loadReviews();

}

async function editReview(review) {

    const name = prompt("Customer name:", review.customer_name);
    if (name === null) return;

    const service = prompt("Tattoo service:", review.service);
    if (service === null) return;

    const rating = prompt("Rating (1–5):", review.rating);
    if (rating === null) return;

    const feedback = prompt("Customer review:", review.review);
    if (feedback === null) return;

    const cleanName = name.trim();
    const cleanService = service.trim();
    const cleanFeedback = feedback.trim();
    const numberRating = Number(rating);

    if (
        cleanName.length < 2 || cleanName.length > 80 ||
        !cleanService ||
        !Number.isInteger(numberRating) ||
        numberRating < 1 || numberRating > 5 ||
        cleanFeedback.length < 10 || cleanFeedback.length > 1000
    ) {
        message.textContent = "Please enter valid review details.";
        return;
    }

    await updateReview(review.id, {
        customer_name: cleanName,
        service: cleanService,
        rating: numberRating,
        review: cleanFeedback
    });

}

async function deleteReview(id) {

    if (!confirm("Are you sure you want to delete this review?")) {
        return;
    }

    const { error } = await tattooAdmin
        .from("tattoo_reviews")
        .delete()
        .eq("id", id);

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = "Review deleted successfully.";

    loadReviews();

}

async function logout() {

    await tattooAdmin.auth.signOut();

    dashboard.style.display = "none";
    loginPanel.style.display = "block";

    document.getElementById("password").value = "";

    message.textContent = "You have logged out.";

}

document.getElementById("filter").addEventListener(
    "change", loadReviews
);

checkSession();

</script>

</body>
</html>
